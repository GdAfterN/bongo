[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bongo"
version = "0.1.0"
description = "Local AI learning agent for notes, practice, review, and trusted-document assistance"
requires-python = ">=3.10"
dependencies = ["mcp", "rich>=13.0", "prompt_toolkit>=3.0"]

[project.scripts]
bongo = "bongo.cli:main"
bongo-mcp = "bongo.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools]
packages = ["bongo"]
