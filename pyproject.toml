[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bongo"
version = "0.2.0"
description = "Desktop learning companion that turns local knowledge into conversations and practice"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.45",
  "openai>=1.60",
  "pydantic>=2.10",
  "pynput>=1.7.7",
  "PySide6>=6.8",
]

[project.scripts]
bongo = "bongo.app:main"

[project.gui-scripts]
bongo-study = "bongo.app:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools]
packages = ["bongo"]

[tool.setuptools.package-data]
bongo = [
  "assets/app-icon.ico",
  "assets/app-icon.png",
  "assets/bongocat/*",
  "assets/bongocat/model/*",
  "assets/bongocat/model/demomodel.1024/*",
  "assets/bongocat/model/resources/*",
  "assets/bongocat/model/resources/left-keys/*",
]
